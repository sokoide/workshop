services:
  traefik:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      # host 8088 (>=1024) because rootless podman cannot bind privileged ports
      - "8088:80"
      - "8080:8080"
    volumes:
      # Docker-compatible API socket. Rootless podman keeps it under the
      # user's runtime directory (e.g. /run/user/1000/podman/podman.sock);
      # rootful podman and Docker use /var/run/docker.sock. Override with
      # PODMAN_SOCKET=... if your layout differs.
      - ${PODMAN_SOCKET:-${XDG_RUNTIME_DIR}/podman/podman.sock}:/var/run/docker.sock:ro

  whoami-a:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

  whoami-b:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
