syntax = "proto3";
package bbs;
option go_package = "github.com/sokoide/workshop/software/assets/bbs/internal/adapters/presentation/grpc/pb";
import "google/protobuf/timestamp.proto";
service BBSService {
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
}
message ListBoardsRequest {}
message ListBoardsResponse { repeated Board boards = 1; }
message ListThreadsRequest { string board_name = 1; }
message ListThreadsResponse { repeated Thread threads = 1; }
message CreateThreadRequest { string board_name = 1; string title = 2; string author = 3; string body = 4; bool owner_only = 5; }
message CreateThreadResponse { Thread thread = 1; Post post = 2; }
message ListPostsRequest { int64 thread_id = 1; }
message ListPostsResponse { repeated Post posts = 1; }
message CreatePostRequest { int64 thread_id = 1; string author = 2; string body = 3; bool sage = 4; }
message CreatePostResponse { Post post = 1; }
message Board { int64 id = 1; string name = 2; string description = 3; google.protobuf.Timestamp created_at = 4; }
message Thread { int64 id = 1; int64 board_id = 2; string title = 3; string owner = 4; bool owner_only = 5; int32 post_count = 6; google.protobuf.Timestamp created_at = 7; google.protobuf.Timestamp last_posted_at = 8; }
message Post { int64 id = 1; int64 thread_id = 2; int32 number = 3; string author = 4; string body = 5; bool sage = 6; google.protobuf.Timestamp created_at = 7; }
